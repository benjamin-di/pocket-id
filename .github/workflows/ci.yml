name: CI
on:
  push:
    branches: [fleet, rollback-2.19.1]
  pull_request:
    branches: [fleet, rollback-2.19.1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - id: gate
        uses: benjamin-di/ci/gate@v1
      - if: steps.gate.outputs.verified != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.verified != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - if: steps.gate.outputs.verified != 'true'
        working-directory: backend
        env:
          POCKET_ID_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags=exclude_frontend,unit ./...
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: gate
        uses: benjamin-di/ci/gate@v1
      - if: steps.gate.outputs.verified != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.verified != 'true'
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - if: steps.gate.outputs.verified != 'true'
        run: vp -C frontend install --frozen-lockfile
      - if: steps.gate.outputs.verified != 'true'
        run: vp -C frontend run build
      - if: steps.gate.outputs.verified != 'true'
        run: vp -C frontend run check
