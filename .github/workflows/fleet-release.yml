name: Fork release
on:
  push:
    tags: ['v*.*.*-fleet.*']
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json status,conclusion --jq '.[0] | [.status,.conclusion] | @tsv')
            if [[ "$result" == $'completed\tsuccess' ]]; then exit 0; fi
            if [[ "$result" == completed* ]]; then
              echo '::error::CI did not pass for the tagged commit'
              exit 1
            fi
            sleep 20
          done
          echo '::error::No successful CI run for the tagged commit'
          exit 1
  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fleet\.[0-9]+$ ]]
          test "$(cat .version)" = "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pocket-id:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=pocket-id-fork
          cache-to: type=gha,scope=pocket-id-fork,mode=max
